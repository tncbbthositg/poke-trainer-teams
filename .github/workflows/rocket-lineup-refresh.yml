name: Rocket Lineup Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-rocket-lineups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn data:update:rocket
      - run: yarn data:validate
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-rocket-lineups
          delete-branch: true
          title: "chore(data): refresh Rocket lineups"
          commit-message: "chore(data): refresh Rocket lineups"
          body: |
            Automated Rocket lineup refresh.

            This PR was generated by the weekly Rocket lineup refresh workflow after `yarn data:update:rocket` produced checked-in snapshot changes.

            Review source provenance and lineup disagreements before merging. GitHub Pages deploys from `main` after merge.
          add-paths: |
            public/data/rocket-lineups.json
            src/data/generated/rocket-lineups.json
